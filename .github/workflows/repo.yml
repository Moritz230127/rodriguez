name: repo

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: repo-publish
  cancel-in-progress: false

env:
  REPO_NAME: rodriguez
  RELEASE_TAG: rolling
  DSH_REPO: Moritz230127/deepseek-harness-desktop-wayland
  DSH_TAG: rolling

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git gnupg sudo github-cli meson ninja gtk4 wayland wayland-protocols
          id builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          install -d -m700 -o builder -g builder /home/builder/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | sudo -u builder gpg --batch --import
          KEYID=$(sudo -u builder gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          test -n "$KEYID"
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Fetch existing database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo incoming
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --title "Rodriguez pacman repo" --notes "rolling"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern "$REPO_NAME.db*" --pattern "$REPO_NAME.files*" \
            --dir repo --clobber || true
          if [ -f "repo/$REPO_NAME.db" ]; then cp -f "repo/$REPO_NAME.db" "repo/$REPO_NAME.db.tar.gz"; fi
          if [ -f "repo/$REPO_NAME.files" ]; then cp -f "repo/$REPO_NAME.files" "repo/$REPO_NAME.files.tar.gz"; fi
          chown -R builder:builder repo incoming

      - name: Build gtk4-layer-shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset=$(bash -c 'source "$1"; echo "${pkgname}-${pkgver}-${pkgrel}-${arch[0]}.pkg.tar.zst"' _ pkgs/gtk4-layer-shell/PKGBUILD)
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "already published: $asset"
          else
            ( cd pkgs/gtk4-layer-shell && sudo -u builder makepkg -sf --nodeps --noconfirm --sign --key "$KEYID" )
            cp pkgs/gtk4-layer-shell/*.pkg.tar.zst pkgs/gtk4-layer-shell/*.pkg.tar.zst.sig repo/
          fi

      - name: Resolve latest Niri release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo Moritz230127/niri-side-note --json tagName --jq .tagName)
          base=${tag#v}
          case "$base" in
            *-niri.*) ver=${base%-niri.*}; rel=${base##*-niri.} ;;
            *) ver=$base; rel=1 ;;
          esac
          asset=$(gh release view --repo Moritz230127/niri-side-note --json assets \
            --jq '.assets[] | select(.name|endswith("linux-x86_64.tar.gz")) | .name' | sed -n '1p')
          test -n "$asset"
          pkg="niri-side-note-bin-$ver-$rel-x86_64.pkg.tar.zst"
          assets=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if printf '%s\n' "$assets" | grep -qx "$pkg"; then
            echo "NIRI_SKIP=1" >> "$GITHUB_ENV"
            echo "already published: $pkg"
            exit 0
          fi
          url="https://github.com/Moritz230127/niri-side-note/releases/download/$tag/$asset"
          gh release download "$tag" --repo Moritz230127/niri-side-note \
            --pattern "$asset" --dir incoming --clobber
          sha=$(sha256sum "incoming/$asset" | awk '{print $1}')
          {
            echo "NIRI_PKGVER=$ver"
            echo "NIRI_PKGREL=$rel"
            echo "NIRI_ASSET=$asset"
            echo "NIRI_URL=$url"
            echo "NIRI_SHA256=$sha"
          } >> "$GITHUB_ENV"

      - name: Package Niri Side Note
        run: |
          if [ "${NIRI_SKIP:-0}" = 1 ]; then
            echo "already published; skip Niri package"
            exit 0
          fi
          ( cd pkgs/niri-side-note-bin && sudo -u builder env \
              NIRI_PKGVER="$NIRI_PKGVER" NIRI_PKGREL="$NIRI_PKGREL" \
              NIRI_ASSET="$NIRI_ASSET" NIRI_URL="$NIRI_URL" NIRI_SHA256="$NIRI_SHA256" \
              SRCDEST="$GITHUB_WORKSPACE/incoming" \
              makepkg -sf --nodeps --noconfirm --sign --key "$KEYID" )
          cp pkgs/niri-side-note-bin/*.pkg.tar.zst pkgs/niri-side-note-bin/*.pkg.tar.zst.sig repo/

      - name: Mirror DSH release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$DSH_TAG" -R "$DSH_REPO" --pattern latest --dir incoming --clobber
          ARTIFACT=$(awk -F= '/^artifact=/{print $2}' incoming/latest)
          test -n "$ARTIFACT"
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' | grep -qx "$ARTIFACT"; then
            echo "already published: $ARTIFACT"
            exit 0
          fi
          gh release download "$DSH_TAG" -R "$DSH_REPO" \
            --pattern "$ARTIFACT" --pattern SHA256SUMS --dir incoming --clobber
          EXPECTED=$(awk -v f="$ARTIFACT" '{ n=$2; sub(/^\*/, "", n); if (n==f) print $1 }' incoming/SHA256SUMS)
          ACTUAL=$(sha256sum "incoming/$ARTIFACT" | awk '{print $1}')
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          sudo -u builder gpg --batch --yes --detach-sign --local-user "$KEYID" \
            --output "incoming/$ARTIFACT.sig" "incoming/$ARTIFACT"
          cp "incoming/$ARTIFACT" "incoming/$ARTIFACT.sig" repo/

      - name: Update signed database
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(repo/*.pkg.tar.zst)
          if (( ${#pkgs[@]} )); then
            sudo -u builder repo-add --sign --key "$KEYID" \
              "repo/$REPO_NAME.db.tar.gz" "${pkgs[@]}"
          else
            echo "no new packages; keeping existing database"
          fi
          cd repo
          rm -f "$REPO_NAME.db" "$REPO_NAME.files" "$REPO_NAME.db.sig" "$REPO_NAME.files.sig"
          cp -f "$REPO_NAME.db.tar.gz" "$REPO_NAME.db"
          cp -f "$REPO_NAME.files.tar.gz" "$REPO_NAME.files"
          cp -f "$REPO_NAME.db.tar.gz.sig" "$REPO_NAME.db.sig"
          cp -f "$REPO_NAME.files.tar.gz.sig" "$REPO_NAME.files.sig"
          cp -f "$GITHUB_WORKSPACE/keys/packages.asc" "$GITHUB_WORKSPACE/repo/packages.asc"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            "repo/$REPO_NAME.db" "repo/$REPO_NAME.db.sig"
            "repo/$REPO_NAME.db.tar.gz" "repo/$REPO_NAME.db.tar.gz.sig"
            "repo/$REPO_NAME.files" "repo/$REPO_NAME.files.sig"
            "repo/$REPO_NAME.files.tar.gz" "repo/$REPO_NAME.files.tar.gz.sig"
            "repo/packages.asc"
          )
          files+=(repo/*.pkg.tar.zst)
          files+=(repo/*.pkg.tar.zst.sig)
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${files[@]}" --clobber
